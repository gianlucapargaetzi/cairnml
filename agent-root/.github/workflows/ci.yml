name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pick the SDK's ref
        id: sdk-ref
        uses: ./.github/actions/same-named-ref
        with:
          repository: gianlucapargaetzi/cairnml
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: ${{ steps.sdk-ref.outputs.ref }}
          path: sdk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install "./sdk[gpu]" -e "." -r tests/requirements.txt
      - run: python -m pytest tests -q --ignore=tests/requirements --ignore=tests/package

  # Dead code: vulture at 80% confidence, with every deliberate name listed in vulture_whitelist.py. New unused code fails here.
  dead-code:
    if: github.event.pull_request.draft == false
    name: dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install vulture==2.16
      - run: vulture cairnml_agent vulture_whitelist.py --min-confidence 80 --exclude '*_vendor*,*/external/*,*backend_api/services*,*/tests/*'

  # API contract: the agent's hand-written code must agree with the server's schema. check-callers fails when a request
  # class names an action or a field the schema does not have, when a call names its service and action as strings
  # (session.send_request("tasks", "get_all", ...)) instead of building the generated request class, when an API version
  # is written by hand, or when a method is called on a session that the Session classes do not have. The server (sparse:
  # only the schema and the generator) is the source of truth, and the SDK supplies the Session class the agent's
  # Session inherits from (--base). Both are read at their main, or at their branch named like this pull request's
  # branch when there is one (work that spans the repositories: give the pull requests the same branch name).
  # Red here means "the agent and the server disagree": fix the agent.
  api-contract:
    if: github.event.pull_request.draft == false
    name: api contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pick the SDK's ref
        id: sdk-ref
        uses: ./.github/actions/same-named-ref
        with:
          repository: gianlucapargaetzi/cairnml
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: ${{ steps.sdk-ref.outputs.ref }}
          path: sdk
      - name: Pick the server's ref
        id: server-ref
        uses: ./.github/actions/same-named-ref
        with:
          repository: gianlucapargaetzi/cairnml-server
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-server
          ref: ${{ steps.server-ref.outputs.ref }}
          path: server
          sparse-checkout: |
            apiserver/__init__.py
            apiserver/schema_rules.py
            apiserver/client_generator
            apiserver/schema/services
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyhocon jinja2 requests
      - name: The hand-written callers agree with the schema
        run: python -m apiserver.client_generator check-callers --target agent --root cairnml_agent --base sdk/cairnml
        env:
          PYTHONPATH: server

  # Lint: only the Python files a pull request adds or changes are checked, so code it does not touch is never reported.
  # A touched file must be clean for the rules below (pyflakes, bugbear's raise-from, bare except, mutable defaults, loop
  # closures, pylint errors); a file the pull request adds must also be formatted at line length 120 (ruff.toml).
  ruff:
    name: ruff
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r lint-requirements.txt
      - name: Check the changed files
        run: |
          # Vendored and generated code is never checked (the same list as in the SDK).
          EXCLUDE='_vendor|/external/|backend_api/services|astor_unparse|/pigar|plotlympl|requests_toolbelt'
          BASE="origin/${{ github.base_ref }}"
          git diff --name-only --diff-filter=ACMR "$BASE...HEAD" -- '*.py' | grep -Ev "$EXCLUDE" > touched.txt || true
          git diff --name-only --diff-filter=A "$BASE...HEAD" -- '*.py' | grep -Ev "$EXCLUDE" > added.txt || true
          echo "Touched Python files:"; cat touched.txt
          if [ -s touched.txt ]; then
            xargs -a touched.txt -r ruff check --config ruff.toml --select F,B904,E722,B006,B023,PLE
          fi
          if [ -s added.txt ]; then
            xargs -a added.txt -r ruff format --check --config ruff.toml
          fi

  # pyproject.toml lists the Python versions this package supports, and PyPI shows that list as its badge. The job
  # above is 3.12; this one runs the tests on each of the others, so the list is tested and not only claimed.
  # tests/test_python_versions_tested.py fails when the list and the versions run here differ.
  python-versions:
    if: github.event.pull_request.draft == false
    name: python ${{ matrix.python }}
    # 24.04, not latest: setup-python has no Python 3.9 build for Ubuntu 26.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pick the SDK's ref
        id: sdk-ref
        uses: ./.github/actions/same-named-ref
        with:
          repository: gianlucapargaetzi/cairnml
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: ${{ steps.sdk-ref.outputs.ref }}
          path: sdk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install "./sdk[gpu]" -e "." -r tests/requirements.txt
      - run: python -m pytest tests -q --ignore=tests/requirements --ignore=tests/package

  package:
    if: github.event.pull_request.draft == false
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pick the SDK's ref
        id: sdk-ref
        uses: ./.github/actions/same-named-ref
        with:
          repository: gianlucapargaetzi/cairnml
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: ${{ steps.sdk-ref.outputs.ref }}
          path: sdk
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "./sdk[gpu]" dist/*.whl
          /tmp/clean/bin/python -I -c "import cairnml_agent"
          /tmp/clean/bin/cairnml-agent --help > /dev/null
