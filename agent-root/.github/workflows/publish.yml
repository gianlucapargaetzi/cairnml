name: publish

# Builds the package, then publishes it with PyPI trusted publishing (no token is stored).
# - Run by hand with target "testpypi" to try a release on https://test.pypi.org
# - Publishing a GitHub release publishes to https://pypi.org
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      # Release gate: the SDK this agent was tested with (scripts/sdk-ref) must be a published SDK release, and the
      # version range of requirements.txt must be satisfied by it. Nothing is uploaded when this fails.
      - name: The pinned SDK is a published release the agent accepts
        if: github.event_name == 'release' || inputs.target == 'pypi'
        run: |
          python -m pip install packaging
          git clone -q https://github.com/gianlucapargaetzi/cairnml.git /tmp/sdk
          git -C /tmp/sdk checkout -q "$(tr -d '[:space:]' < scripts/sdk-ref)"
          python - <<'PY'
          import re, subprocess, sys
          from packaging.requirements import Requirement
          sdk = re.search(r'__version__ = .(.+).', open('/tmp/sdk/cairnml/version.py').read()).group(1)
          tags = subprocess.run(['git', '-C', '/tmp/sdk', 'tag', '--points-at', 'HEAD'], capture_output=True, text=True).stdout.split()
          line = next(l for l in open('requirements.txt') if l.startswith('cairnml'))
          spec = Requirement(line.strip()).specifier
          if f'v{sdk}' not in tags:
              sys.exit(f'scripts/sdk-ref is not the commit of the SDK release v{sdk}: release the SDK and move the pin first')
          if sdk not in spec:
              sys.exit(f'SDK {sdk} is outside requirements.txt ({spec})')
          print(f'SDK v{sdk} is released and accepted by requirements.txt')
          PY
      - name: The release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(python -c "import re; print(re.search(r'__version__ = .(.+).', open('cairnml_agent/version.py').read()).group(1))")" = "$TAG"
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
