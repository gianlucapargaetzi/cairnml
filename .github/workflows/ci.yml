name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install -e ".[dataset,router]" pytest
      - run: python -m pytest tests -q

  # Dead code: vulture at 80% confidence, with every deliberate name listed in vulture_whitelist.py. New unused code fails here.
  dead-code:
    if: github.event.pull_request.draft == false
    name: dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install vulture==2.16
      - run: vulture cairnml vulture_whitelist.py --min-confidence 80 --exclude '*_vendor*,*/external/*,*backend_api/services*,*/tests/*'

  # Lint: every Python file of the SDK is checked, not only the ones a pull request touches. A file must be clean for the
  # rules below (pyflakes, bugbear's raise-from, bare except, mutable defaults, loop closures, pylint errors) and must be
  # formatted at line length 120. The formatting commit is listed in .git-blame-ignore-revs.
  ruff:
    name: ruff
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r lint-requirements.txt
      - name: Check every SDK file
        run: |
          # The exclusions are the vendored and generated code: the generated API client is checked by the api-contract job.
          EXCLUDE='_vendor|/external/|backend_api/services'
          git ls-files -- 'cairnml/*.py' | grep -Ev "$EXCLUDE" > all.txt
          xargs -a all.txt -r ruff check --isolated --select F,B904,E722,B006,B023,PLE --line-length 120
          xargs -a all.txt -r ruff format --check --isolated --line-length 120

  # The generated API client (cairnml/backend_api/services/<service>.py) must equal what the server's generator writes
  # from the schema on the server's main, and the hand-written callers must only use actions, request fields and
  # versions that schema has. Red here means "the server changed, update the SDK": run scripts/regenerate-api.sh.
  api-contract:
    if: github.event.pull_request.draft == false
    name: api contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-server
          ref: main
          path: server
          sparse-checkout: |
            apiserver/__init__.py
            apiserver/schema_rules.py
            apiserver/client_generator
            apiserver/schema/services
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyhocon jinja2 requests
      - name: The committed client equals the generator's output
        run: python -m apiserver.client_generator generate --target sdk --out cairnml/backend_api/services --check
        env:
          PYTHONPATH: server
      - name: The hand-written callers agree with the schema
        run: python -m apiserver.client_generator check-callers --target sdk --root cairnml --allow scripts/api-allow.txt
        env:
          PYTHONPATH: server

  # pyproject.toml lists the Python versions this package supports, and PyPI shows that list as its badge. The job
  # above is 3.12; this one runs the tests on each of the others, so the list is tested and not only claimed.
  # tests/test_python_versions_tested.py fails when the list and the versions run here differ.
  python-versions:
    if: github.event.pull_request.draft == false
    name: python ${{ matrix.python }}
    # 24.04, not latest: setup-python has no Python 3.9 build for Ubuntu 26.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install -e ".[dataset,router]" pytest
      - run: python -m pytest tests -q

  package:
    if: github.event.pull_request.draft == false
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -I -c "import cairnml"
          /tmp/clean/bin/cairnml init --help > /dev/null

  # The identity code is copied into the server and the agent (see tests/test_idp_vendored.py). Each copy is
  # compared with the main branch of its repository, so a change to one copy fails here until it is made in all.
  identity-drift:
    name: identity drift
    # Disabled for now: the agent will depend on the SDK, so the identity copies go away. Re-enable or remove with that change.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-server
          ref: main
          path: cairnml-server
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-agent
          ref: main
          path: cairnml-agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - name: Compare the identity copies with the main branches
        run: python -m pytest -q tests/test_idp_vendored.py
        env:
          CAIRNML_IDP_DRIFT_REQUIRED: "1"
          CAIRNML_SERVER_IDP: ${{ github.workspace }}/cairnml-server/apiserver/idp
          CAIRNML_AGENT_IDP: ${{ github.workspace }}/cairnml-agent/cairnml_agent/idp
