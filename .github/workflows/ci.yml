name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install -e ".[dataset]" pytest
      - run: python -m pytest tests -q

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -I -c "import cairnml"
          /tmp/clean/bin/cairnml init --help > /dev/null

  # The identity code is copied into the server and the agent (see tests/test_idp_vendored.py). Each copy is
  # compared with the main branch of its repository, so a change to one copy fails here until it is made in all.
  identity-drift:
    name: identity drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-server
          ref: main
          path: cairnml-server
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-agent
          ref: main
          path: cairnml-agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - name: Compare the identity copies with the main branches
        run: python -m pytest -q tests/test_idp_vendored.py
        env:
          CAIRNML_IDP_DRIFT_REQUIRED: "1"
          CAIRNML_SERVER_IDP: ${{ github.workspace }}/cairnml-server/apiserver/idp
          CAIRNML_AGENT_IDP: ${{ github.workspace }}/cairnml-agent/cairnml_agent/idp
