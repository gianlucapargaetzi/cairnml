name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install -e ".[dataset]" pytest
      - run: python -m pytest tests -q

  # Dead code: vulture at 80% confidence, with every deliberate name listed in vulture_whitelist.py. New unused code fails here.
  dead-code:
    name: dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install vulture==2.16
      - run: vulture cairnml vulture_whitelist.py --min-confidence 80 --exclude '*_vendor*,*/external/*,*backend_api/services*,*/tests/*,*pynvml*'

  # Lint: only the Python files a pull request adds or changes are checked, so code it does not touch is never reported.
  # A touched file must be clean for the rules below (pyflakes, bugbear's raise-from, bare except, mutable defaults, loop
  # closures, pylint errors); a file the pull request adds must also be formatted at line length 120.
  ruff:
    name: ruff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r lint-requirements.txt
      - name: Check the changed files
        run: |
          # The same exclusions the vendored and generated code had under flake8 (.flake8 before this change).
          EXCLUDE='_vendor|/external/|backend_api/services|pynvml|pyrsmi|astor_unparse|/pigar|plotlympl|requests_toolbelt'
          BASE="origin/${{ github.base_ref }}"
          git diff --name-only --diff-filter=ACMR "$BASE...HEAD" -- '*.py' | grep -Ev "$EXCLUDE" > touched.txt || true
          git diff --name-only --diff-filter=A "$BASE...HEAD" -- '*.py' | grep -Ev "$EXCLUDE" > added.txt || true
          echo "Touched Python files:"; cat touched.txt
          if [ -s touched.txt ]; then
            xargs -a touched.txt -r ruff check --isolated --select F,B904,E722,B006,B023,PLE --line-length 120
          fi
          if [ -s added.txt ]; then
            xargs -a added.txt -r ruff format --check --isolated --line-length 120
          fi

  # The generated API client (cairnml/backend_api/services/<service>.py) must equal what the server's generator writes
  # from the schema at the commit in scripts/api-schema-ref, and the hand-written callers must only use actions, request
  # fields and versions that schema has. To refresh: scripts/regenerate-api.sh <server-commit>.
  api-contract:
    name: api contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: pin
        run: echo "ref=$(tr -d '[:space:]' < scripts/api-schema-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-server
          ref: ${{ steps.pin.outputs.ref }}
          path: server
          sparse-checkout: |
            apiserver/__init__.py
            apiserver/client_generator
            apiserver/schema/services
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyhocon jinja2
      - name: The committed client equals the generator's output
        run: python -m apiserver.client_generator generate --target sdk --out cairnml/backend_api/services --check
        env:
          PYTHONPATH: server
      - name: The hand-written callers agree with the schema
        run: python -m apiserver.client_generator check-callers --target sdk --root cairnml --allow scripts/api-allow.txt
        env:
          PYTHONPATH: server

  # pyproject.toml lists the Python versions this package supports, and PyPI shows that list as its badge. The job
  # above is 3.12; this one runs the tests on each of the others, so the list is tested and not only claimed.
  # tests/test_python_versions_tested.py fails when the list and the versions run here differ.
  python-versions:
    name: python ${{ matrix.python }}
    # 24.04, not latest: setup-python has no Python 3.9 build for Ubuntu 26.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - run: python -m pip install -e ".[dataset]" pytest
      - run: python -m pytest tests -q

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -I -c "import cairnml"
          /tmp/clean/bin/cairnml init --help > /dev/null

  # The identity code is copied into the server and the agent (see tests/test_idp_vendored.py). Each copy is
  # compared with the main branch of its repository, so a change to one copy fails here until it is made in all.
  identity-drift:
    name: identity drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-server
          ref: main
          path: cairnml-server
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gianlucapargaetzi/cairnml-agent
          ref: main
          path: cairnml-agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - name: Compare the identity copies with the main branches
        run: python -m pytest -q tests/test_idp_vendored.py
        env:
          CAIRNML_IDP_DRIFT_REQUIRED: "1"
          CAIRNML_SERVER_IDP: ${{ github.workspace }}/cairnml-server/apiserver/idp
          CAIRNML_AGENT_IDP: ${{ github.workspace }}/cairnml-agent/cairnml_agent/idp
