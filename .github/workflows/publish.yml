name: publish

# Builds the package, then publishes it with PyPI trusted publishing (no token is stored).
# - Run by hand with target "testpypi" to try a release on https://test.pypi.org
# - Publishing a GitHub release publishes to https://pypi.org
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine pyhocon jinja2
      # Release gate: the server schema this client was generated from (scripts/api-schema-ref) must be part of a
      # released server, and the committed client must equal what that schema generates. Nothing is uploaded when
      # this fails. Release order: server first, then the SDK, then the agent.
      - name: The client matches a released server
        if: github.event_name == 'release' || inputs.target == 'pypi'
        run: |
          REF="$(tr -d '[:space:]' < scripts/api-schema-ref)"
          git clone -q --filter=blob:none --no-checkout https://github.com/gianlucapargaetzi/cairnml-server.git /tmp/server
          git -C /tmp/server checkout -q "$REF"
          TAGS="$(git -C /tmp/server tag --contains "$REF" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          test -n "$TAGS" || { echo "server commit $REF is in no server release: release the server first"; exit 1; }
          echo "server commit $REF is in: $TAGS"
          PYTHONPATH=/tmp/server python -m apiserver.client_generator generate --target sdk --out cairnml/backend_api/services --check
      - name: The release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(python -c "import re; print(re.search(r'__version__ = .(.+).', open('cairnml/version.py').read()).group(1))")" = "$TAG"
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
