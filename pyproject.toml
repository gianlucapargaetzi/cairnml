[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cairnml"
dynamic = ["version", "dependencies"]
description = "CairnML - experiment tracking, remote jobs and git-based datasets (an unofficial fork of ClearML)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "Gianluca Pargaetzi", email = "121188387+gianlucapargaetzi@users.noreply.github.com" }]
keywords = ["cairnml", "clearml", "development", "machine learning", "deep learning", "version control", "experiment manager", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Source = "https://github.com/gianlucapargaetzi/cairnml"
Issues = "https://github.com/gianlucapargaetzi/cairnml/issues"
"Based on" = "https://github.com/clearml/clearml"

[project.optional-dependencies]
s3 = ["boto3>=1.9"]
azure = ["azure-storage-blob>=12.0.0"]
gs = ["google-cloud-storage>=1.13.2"]
dataset = ["dvc[s3]>=3.50", "pyarrow>=14"]
gpu = ["nvidia-ml-py>=13.615.71", "gpustat>=1.1.1,<2"]
plot = ["plotly>=7.1.0"]
router = ["fastapi>=0.115.2", "uvicorn>=0.31.1", "httpx>=0.27.2"]
agent = [
    "psutil>=3.4.2,<7.3",
    "urllib3>=1.21.1,<3",
    "virtualenv>=16,<21",
    "requests>=2.20.0,<2.33",
    "setuptools<82.0.0",
    "pywin32; sys_platform == 'win32'",
    "pyjwt>=2.4.0,<3.0.0",
    "cryptography>=43.0.0",
    "pyyaml>=6.0,<7",
    "python-dateutil>=2.8,<3",
    "furl>=2.1,<3",
    "pyparsing>=3,<4",
    "attrs>=21.3,<26",
    "pyhocon>=0.3.60,<0.4",
    "jsonmodels>=2.7,<3",
    "nvidia-ml-py>=11.450.129,<14",
    "gpustat>=1.1.1,<2",
    "jsonschema>=4.17,<5",
    "packaging>=23.2",
    "requirements-parser>=0.13.1,<0.14",
]

[project.scripts]
cairnml = "cairnml.cli.__main__:main"
cairnml-agent = "cairnml.agent_launcher:main"

[tool.setuptools.dynamic]
version = { attr = "cairnml.version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
markers = [
    "integration: needs a real CairnML server; set CAIRNML_TEST_SERVER and CAIRNML_TEST_HOME (see CONTRIBUTING.md)",
]

[tool.setuptools.packages.find]
exclude = ["contrib*", "docs*", "data*", "examples*", "tests*"]

[tool.setuptools.package-data]
cairnml = ["config/default/*.conf", "backend_api/config/default/*.conf", "py.typed", "idp/*.svg"]
cairnml_agent = ["backend_api/config/default/*.conf"]
